name: Lint Check
on:
  push:
    # dependabot/**: Dependabot's Gradle bump branches. Its docker and github-actions bumps do not
    # touch the paths below, so they do not trigger this workflow.
    branches: ["feature/*", "feat/*", "features/*", "dependabot/**"]
    paths: ["src/**", "test/**", "*.gradle.kts"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint check
        run: ./gradlew ktlintCheck
