# Template only — DO NOT commit a populated copy.
# Apply once with real values; stringData fields get base64-encoded by the API server.
#
# Keys (injected into the container directly via envFrom):
#   APP_CONFIG_SECURITY_GATEWAY_SHARED_SECRET   Backend hop proof (X-Gateway-Auth).
#                                               Must equal blog_be's GATEWAY_SHARED_SECRET.
#                                               Generate with: openssl rand -hex 32
#
#   APP_CONFIG_REDIS_PASSWORD                   Redis auth (rate-limit / blacklist distributed counters).
#                                               Must match infra/redis operations value.
#
#   APP_CONFIG_SECURITY_ALLOWED_API_KEYS_0      Optional. Keys allowed their own rate-limit
#   APP_CONFIG_SECURITY_ALLOWED_API_KEYS_1      bucket (app.config.security.allowed-api-keys).
#                                               Unset = the per-API-key dimension stays inert.
#                                               Values belong here, not in the ConfigMap.
#
# JWT verification uses RS256 via JWKS — no shared secret is held by the gateway.
# Each issuer's JWKS URI is set in the ConfigMap as APP_CONFIG_JWT_ISSUERS_<N>_JWKS_URI;
# each backend holds its own signing private key.
#
# deployment.yaml's envFrom.secretRef is optional: false, so a missing Secret crashes the pod
# rather than letting it boot without a Redis password (see the fail-fast note there).
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: api-service
  labels:
    app: api-gateway-deploy
type: Opaque
stringData:
  APP_CONFIG_SECURITY_GATEWAY_SHARED_SECRET: "REPLACE_ME_shared_secret_same_as_blog_be_GATEWAY_SHARED_SECRET"
  APP_CONFIG_REDIS_PASSWORD: "REPLACE_ME_redis_password"
  # Uncomment to enable the per-API-key rate limit for specific keys:
  # APP_CONFIG_SECURITY_ALLOWED_API_KEYS_0: "REPLACE_ME_api_key"
